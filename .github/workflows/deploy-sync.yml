name: Deploy Cloudflare sync

on:
  push:
    branches: [main]
    paths:
      - 'sync/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloudflare-sync
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          npm run deploy -- --tag "git-${GITHUB_SHA:0:12}" --message "GitHub commit ${GITHUB_SHA}"
      - name: Verify public sync endpoint
        run: node verify-deployment.mjs
