name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
  # GITHUB_TOKEN commits from the data updater do not trigger push workflows.
  workflow_run:
    workflows: ['Market data update (manual)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test calculations and independently reproduce every built-in model
        run: |
          node --test app/scripts/*.test.mjs
          node app/scripts/audit-export.mjs --output .private/deploy-validation/browser.json
          python3 app/scripts/audit-data.py app/data/prices-weekly.json .private/deploy-validation/browser.json
      - name: Build application with the latest committed data
        run: |
          node app/scripts/build.mjs
          node app/scripts/publish.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
