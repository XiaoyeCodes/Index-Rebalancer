name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
  # GITHUB_TOKEN pushes do not trigger push workflows. The public catch-up
  # job calls this workflow directly only when an actual publication is due.
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test calculations and independently reproduce every built-in model
        run: |
          node --test app/scripts/*.test.mjs
          node app/scripts/audit-export.mjs --output .private/deploy-validation/browser.json
          python3 app/scripts/audit-data.py app/data/prices-weekly.json .private/deploy-validation/browser.json
      - name: Build application with the latest committed data
        run: |
          node app/scripts/build.mjs
          PUBLISHED_SOURCE_COMMIT="$(git rev-parse HEAD)" node app/scripts/publish.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: dist
      - name: Wait for the uploaded site to appear in the run's artifact list
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..18}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub has not indexed the uploaded Pages artifact $ARTIFACT_ID"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the deployed market snapshot on the public website
        run: node app/scripts/site-freshness.mjs --verify
