name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
  # GITHUB_TOKEN pushes do not trigger push workflows. The public catch-up
  # job calls this workflow directly only when an actual publication is due.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test calculations and independently reproduce every built-in model
        run: |
          node --test app/scripts/*.test.mjs
          node app/scripts/audit-export.mjs --output .private/deploy-validation/browser.json
          python3 app/scripts/audit-data.py app/data/prices-weekly.json .private/deploy-validation/browser.json
      - name: Build application with the latest committed data
        run: |
          node app/scripts/build.mjs
          PUBLISHED_SOURCE_COMMIT="$(git rev-parse HEAD)" node app/scripts/publish.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: dist
      - name: Deploy the uploaded artifact to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // The upload supplies the exact ID even when listing artifacts by name returns an empty list.
            const artifactId = Number(process.env.ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw Error('Missing uploaded Pages artifact ID')
            const { sourceCommit } = JSON.parse(require('node:fs').readFileSync('dist/data-status.json', 'utf8'))
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifactId, pages_build_version: sourceCommit, oidc_token: await core.getIDToken()
            })
            core.setOutput('page_url', data.page_url)
            core.setOutput('deployment_id', data.id)
      - name: Wait for Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          for attempt in {1..48}; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$DEPLOYMENT_ID" --jq '.status') || status=unavailable
            case "$status" in
              succeed) exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost) echo "::error::Pages reported $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Timed out waiting for Pages deployment $DEPLOYMENT_ID"
          exit 1
      - name: Verify the deployed market snapshot on the public website
        run: node app/scripts/site-freshness.mjs --verify
      - name: Cancel pending Pages deployment on cancellation
        if: cancelled() && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$DEPLOYMENT_ID/cancel"
