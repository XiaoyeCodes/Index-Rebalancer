# The private updater is the primary schedule. This public fallback can also
# repair Pages when a validated commit arrived but its deployment did not.
name: Market data catch-up

on:
  schedule:
    - cron: '13 0,2,4 * * 2-6'
  workflow_dispatch:
    inputs:
      force_update:
        description: Revalidate even when the public snapshot is current
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      plan: ${{ steps.check.outputs.plan }}
      updated: ${{ steps.prices.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compare the expected close with the repository and public website
        id: check
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_update }}
        run: node app/scripts/site-freshness.mjs

      - name: Configure commit identity
        if: steps.check.outputs.plan == 'update'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update data, rebuild page, commit and push
        if: steps.check.outputs.plan == 'update'
        id: prices
        continue-on-error: true
        run: |
          echo "MARKET_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
          timeout --kill-after=20s 28m node app/scripts/update-retry.mjs --git --refresh-checkout

      - name: Record an exhausted update and notify once
        if: steps.prices.outcome == 'failure'
        run: node app/scripts/market-incident.mjs data

      - name: Resolve an open incident if the published application verifies
        if: steps.check.outputs.plan == 'current'
        run: node app/scripts/market-incident.mjs verified

  publish:
    needs: update
    if: needs.update.outputs.updated == 'success' || needs.update.outputs.plan == 'deploy'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
