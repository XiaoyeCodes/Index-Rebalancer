# Manual fallback. Scheduled updates run in the private Index-Rebalancer-Automation repository
# so the public-repository 60-day inactivity rule cannot disable the scheduled updater.
# Downloads from Yahoo Finance, rebuilds the weekly data and app/heng.html, then commits and pushes
# the validated snapshot, its evidence, and the rebuilt page. Manual fallback only.
name: Market data update (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update data, rebuild page, commit and push
        run: node app/scripts/update.mjs --git
