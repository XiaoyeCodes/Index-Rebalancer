<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>衡 · 再平衡天平</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="stage" id="stage">
    <header class="brand">
      <span class="mark">衡</span>
      <div><b>再平衡天平</b><small>Steady by design</small></div>
    </header>
    <div class="hint">拖动托盘上下 · 拖动空白处旋转 · 滚轮缩放</div>
    <div class="tip" id="tip" hidden></div>
  </main>

  <aside class="panel">
    <section class="status" id="status"></section>

    <section>
      <h2>定投模型</h2>
      <div class="chips" id="presets"></div>
    </section>

    <section>
      <div class="row-head">
        <h2>我的持仓</h2>
        <span class="muted" id="asOf"></span>
      </div>
      <table class="holdings">
        <thead><tr><th>标的</th><th class="r">持有股数</th><th class="r">占比 / 目标</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <section class="actions">
      <button class="btn primary" id="rebalance">按目标再平衡</button>
      <button class="btn" id="shock">模拟一周行情</button>
      <button class="btn ghost" id="reset">恢复示例</button>
    </section>
    <p class="ops" id="ops"></p>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
