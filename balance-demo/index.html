<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Rebalancing · 再平衡天平</title>
  <link rel="icon" type="image/png" href="../app/assets/favicon.png" />
</head>
<body>
  <header class="brand">
    <img class="mark" src="../app/assets/dynamic-rebalancing-logo.webp" width="40" height="40" alt="" />
    <div><h1>再平衡天平</h1><small>Dynamic Rebalancing</small></div>
    <span class="muted" id="asOf"></span>
  </header>
  <main class="stage" id="stage">
    <div class="hint">拖动托盘上下 · 拖动空白处旋转 · 滚轮缩放</div>
    <div class="tip" id="tip" hidden></div>
  </main>

  <aside class="panel" aria-label="模型与持仓设置">
    <section class="status" id="status"></section>

    <section>
      <h2>定投模型</h2>
      <div class="chips" id="presets"></div>
    </section>

    <section>
      <div class="row-head">
        <h2>我的持仓</h2>

      </div>
      <table class="holdings">
        <thead><tr><th>标的</th><th class="r">持有股数</th><th class="r">占比 / 目标</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <section class="actions">
      <button class="btn primary" id="rebalance">按目标再平衡</button>
      <button class="btn" id="shock">模拟一周行情</button>
      <button class="btn ghost" id="reset">恢复示例</button>
    </section>
    <p class="ops" id="ops"></p>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
