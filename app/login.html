<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>登录 · Dynamic Rebalancing</title>
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="动态再平衡"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./assets/app-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f9f8f5;color:#191919;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{width:min(410px,calc(100% - 32px));padding:36px;background:white;border:1px solid #e7e3dc;border-radius:24px}header{display:flex;align-items:center;gap:10px;font-weight:650}i{width:20px;height:20px;border:6px solid #ea4f2b;border-radius:6px;transform:rotate(45deg)}h1{font-size:28px;margin:28px 0 16px}label{display:block;margin:0 0 6px}input,button{font:inherit;width:100%;padding:12px 14px;border-radius:12px}input{border:1px solid #bfb9b1}button{background:#191919;color:#fff;border:none;margin-top:18px;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #f19779;outline-offset:2px}p{font-size:14px;color:#61584f;margin-bottom:0}#status{color:#9c3923}p:empty{display:none}
.remember-login{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:14px;color:#61584f;cursor:pointer}.remember-login input{width:16px;height:16px;padding:0;margin:0;accent-color:#191919;flex:none}
body{padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}main{width:min(410px,100%)}button,input[type=password]{min-height:48px}@media(max-width:480px){main{padding:28px 24px}h1{font-size:26px}}
</style></head><body><main><header><i aria-hidden="true"></i>Dynamic Rebalancing</header><h1>登录你的账户</h1>
<form><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="512" required><label class="remember-login"><input id="remember" name="remember" type="checkbox" checked>保持登录（30 天）</label><button>登录</button></form>
<p id="connection"></p><p id="status" role="alert"></p></main><!-- login runtime --><script>
(()=>{
 const status=document.getElementById('status'),form=document.querySelector('form'),button=form.querySelector('button');
 const api=(path,init={})=>fetch(path,{...init,credentials:'same-origin',cache:'no-store',redirect:'error'});
 async function open(){
   const response=await api('/api/account/app');
   if(!response.ok)throw Error('登录已过期，请重新登录。');
   const html=await response.text();
   Object.defineProperty(window,'privateAccount',{configurable:true,value:{
     api,pages:false,verifyPassword:async password=>{const response=await api('/api/account/verify-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const data=await response.json();if(!response.ok)throw Error(data.detail||'密码不正确。');return true;},logout:async()=>{await api('/api/account/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});location.reload();}
   }});
   document.open();document.write(html);document.close();
 }
 form.onsubmit=async event=>{
   event.preventDefault();button.disabled=true;status.textContent='';
   try{
     const res=await api('/api/account/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:form.password.value,remember:form.remember.checked})});
     const data=await res.json();if(!res.ok)throw Error(data.detail || '登录失败。');
     form.password.value='';await open();
   }catch(e){status.textContent=e instanceof TypeError?'连接失败，请确认本地服务已启动，并检查浏览器的本地网络权限。':e.message;button.disabled=false;}
 };
 api('/api/account/status').then(res=>{if(res.ok)return open()}).catch(()=>{});
})();
</script></body></html>
